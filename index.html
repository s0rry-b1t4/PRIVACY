:root {

    --subtext: #9ca3af;

    --border: #1f2937;

body {

.wrapper {
    display: flex;
    justify-content: center;
    padding: 40px 20px;

.container {
    max-width: 920px;
    width: 100%;

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.logo {
    font-weight: 600;
    font-size: 22px;
    background: var(--gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
}

.controls button {
    padding: 6px 12px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #e5e7eb;
    transition: background-color 0.25s ease, transform 0.2s ease, color 0.25s ease;
    white-space: nowrap;
}

}

.controls button.active {

    color: white;
    font-weight: 500;

#content {
    transition: all 0.25s ease;
    opacity: 1;
    transform: translateY(0);
}

.card {

    border: 1px solid var(--border);

    margin-bottom: 16px;
    animation: fadeIn 0.3s ease;

@keyframes fadeIn {

    to {opacity: 1; transform: translateY(0);}
}

h1 { margin: 10px 0; }
h2 { margin-top: 0; font-size: 18px; }
p { color: var(--subtext); line-height: 1.6; }

ul { padding-left: 18px; }

.footer {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    color: var(--subtext);

@media (max-width: 600px) {
    .topbar {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;

        justify-content: flex-start;
    }

* {

    transition-duration: 0.35s;
    transition-timing-function: ease;

function setLang(lang) {
    const el = document.getElementById("content");

    document.documentElement.lang = lang;

    el.style.opacity = "0";
    el.style.transform = "translateY(10px)";

    setTimeout(() => {
        localStorage.setItem("lang", lang);
        el.innerHTML = content[lang];

        document.querySelectorAll(".controls button").forEach(btn => {
            btn.classList.remove("active");
        });

        const activeBtn = document.querySelector(`.controls button[onclick="setLang('${lang}')"]`);
        if (activeBtn) activeBtn.classList.add("active");

        el.style.opacity = "1";
        el.style.transform = "translateY(0)";
    }, 200);
}

function updateThemeIcon(isDark) {
    const btn = document.getElementById("themeBtn");

    if (btn) {
        btn.textContent = isDark ? "☀️" : "🌙";
    }
}

function toggleTheme() {
    const isDark = document.body.classList.toggle("dark");
    localStorage.setItem("theme", isDark ? "dark" : "light");

    updateThemeIcon(isDark);
}

function initTheme() {
    const saved = localStorage.getItem("theme");

    let isDark = false;

    if (saved === "dark") {
        document.body.classList.add("dark");
        isDark = true;
    } else {
        document.body.classList.remove("dark");
        localStorage.setItem("theme", "light");
    }

    updateThemeIcon(isDark);
}

initTheme();

const savedLang = localStorage.getItem("lang") || "ru";
setLang(savedLang);
</script>
