<!DOCTYPE html>

<meta charset="UTF-8">

<title>Privacy Policy | Outside the System</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #f7f8fc;
    --text: #1f2937;
    --subtext: #6b7280;
    --card: #ffffff;
    --border: #e5e7eb;
    --gradient: linear-gradient(90deg, #7c3aed, #f97316);
}

.dark {
    --bg: #0b0f19;
    --text: #e5e7eb;
    --subtext: #9ca3af;
    --card: #111827;
    --border: #1f2937;
}

body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: all 0.3s ease;
}

.wrapper {
    display: flex;
    justify-content: center;
    padding: 40px 20px;
}

.container {
    max-width: 920px;
    width: 100%;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.logo {
    font-weight: 600;
    font-size: 22px;
    background: var(--gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
}

.controls button {
    padding: 6px 12px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #e5e7eb;
    transition: 0.2s;
    white-space: nowrap;
}

.controls button:hover {
    transform: translateY(-1px);
}

#content {
    transition: all 0.25s ease;
    opacity: 1;
    transform: translateY(0);
}

.card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 16px;
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(10px);}
    to {opacity: 1; transform: translateY(0);}
}

h1 { margin: 10px 0; }
h2 { margin-top: 0; font-size: 18px; }
p { color: var(--subtext); line-height: 1.6; }

ul { padding-left: 18px; }

.footer {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    color: var(--subtext);
}

@media (max-width: 600px) {
    .topbar {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
    }

    .controls {
        justify-content: flex-start;
    }
}
</style>
</head>

<body>

<div class="wrapper">
<div class="container">

<div class="topbar">
    <div class="logo">Outside the System</div>
    <div class="controls">
        <button onclick="setLang('ru')">RU</button>
        <button onclick="setLang('en')">EN</button>
        <button onclick="setLang('es')">ES</button>
        <button onclick="setLang('fr')">FR</button>
        <button onclick="toggleTheme()">🌙</button>

<div id="content"></div>

<div class="footer">© Outside the System</div>

function setLang(lang) {
    const el = document.getElementById("content");

    document.documentElement.lang = lang;

    el.style.opacity = "0";
    el.style.transform = "translateY(10px)";

    setTimeout(() => {
        localStorage.setItem("lang", lang);
        el.innerHTML = content[lang];

        el.style.opacity = "1";
        el.style.transform = "translateY(0)";
    }, 200);
}

function toggleTheme() {
    const isDark = document.body.classList.toggle("dark");
    localStorage.setItem("theme", isDark ? "dark" : "light");
}

function initTheme() {
    const saved = localStorage.getItem("theme");

    if (saved === "dark") {
        document.body.classList.add("dark");
    } else {
        document.body.classList.remove("dark");
        localStorage.setItem("theme", "light");
    }
}

initTheme();

const savedLang = localStorage.getItem("lang") || "ru";
setLang(savedLang);
